# Alembic configuration. Deliberately small — most defaults are fine, and the
# few things we care about (the DB URL, the model metadata) live in
# alembic/env.py where they can read app.config.

[alembic]
# Path Alembic writes new migrations into, relative to this file.
script_location = alembic

# Sort migration filenames by the timestamp Alembic prepends when it writes
# one — the readable "2026_07_23_..." format. Nice for humans; irrelevant to
# how migrations actually run (that's the down_revision chain).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Interpret timestamps in file_template as UTC, not local time.
timezone = UTC

# sqlalchemy.url is intentionally NOT set here — env.py reads it from
# app.config so we have exactly one source of truth for the connection
# details. Setting it in this file would fork the truth.

# --- Logging --------------------------------------------------------------
# Alembic writes friendly progress lines to the "alembic" logger. Kept at
# INFO so a normal `alembic upgrade head` says what it did.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
