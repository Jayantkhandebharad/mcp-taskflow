<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
  </head>
  <body>
    <!-- React mounts here (see src/main.tsx). Everything else is JavaScript. -->

         In dev it serves the .tsx as-is (transpiled on request); in build it

    <script type="module" src="/src/main.tsx"></script>
  </body>
